name: One-time Ruff cleanup

on:
  push:
    branches: [trace-supervised-knapsack-search]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trace-supervised-knapsack-search
          fetch-depth: 0

      - name: Install Ruff and clean the tree
        run: |
          python -m pip install "ruff>=0.6,<1"
          ruff check --fix --unsafe-fixes . || true
          python - <<'PY'
          from pathlib import Path

          path = Path("src/narcopt/domain.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          def replace_line(exact: str, replacement: list[str]) -> None:
              for index, line in enumerate(lines):
                  if line.strip() == exact:
                      indent = line[: len(line) - len(line.lstrip())]
                      lines[index : index + 1] = [indent + value for value in replacement]
                      return
              raise RuntimeError(f"expected Ruff residual was not found: {exact}")

          replace_line(
              "if isinstance(chosen, bool) or isinstance(chosen, (int, np.integer)) and int(chosen) in {0, 1}:",
              [
                  "if isinstance(chosen, bool) or (",
                  "    isinstance(chosen, (int, np.integer)) and int(chosen) in {0, 1}",
                  "):",
              ],
          )
          replace_line(
              "if candidate.objective > best.objective or candidate.objective == best.objective and candidate.selection < best.selection:",
              [
                  "if candidate.objective > best.objective or (",
                  "    candidate.objective == best.objective",
                  "    and candidate.selection < best.selection",
                  "):",
              ],
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          ruff format .
          ruff check .
          ruff format --check .

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Ruff changes required."
          else
            git commit -m "Apply Ruff lint and formatting cleanup"
            git push origin HEAD:trace-supervised-knapsack-search
          fi
