name: One-time Ruff cleanup

on:
  push:
    branches: [trace-supervised-knapsack-search]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trace-supervised-knapsack-search
          fetch-depth: 0

      - name: Install Ruff and clean the tree
        run: |
          python -m pip install "ruff>=0.6,<1"
          ruff check --fix --unsafe-fixes . || true
          python - <<'PY'
          from pathlib import Path

          path = Path("src/narcopt/domain.py")
          text = path.read_text(encoding="utf-8")
          old_binary = """    for chosen in selection:
              if isinstance(chosen, bool) or isinstance(chosen, (int, np.integer)) and int(chosen) in {0, 1}:
                  normalized.append(int(chosen))
              else:
                  raise ValueError(\"selection entries must be binary\")
          """
          new_binary = """    for chosen in selection:
              if isinstance(chosen, bool) or (
                  isinstance(chosen, (int, np.integer)) and int(chosen) in {0, 1}
              ):
                  normalized.append(int(chosen))
              else:
                  raise ValueError(\"selection entries must be binary\")
          """
          old_tie = """        if candidate.objective > best.objective or candidate.objective == best.objective and candidate.selection < best.selection:
                      best = candidate
          """
          new_tie = """        if candidate.objective > best.objective or (
                      candidate.objective == best.objective
                      and candidate.selection < best.selection
                  ):
                      best = candidate
          """
          if old_binary not in text or old_tie not in text:
              raise RuntimeError("expected Ruff residuals were not found")
          path.write_text(
              text.replace(old_binary, new_binary).replace(old_tie, new_tie),
              encoding="utf-8",
          )
          PY
          ruff format .
          ruff check .
          ruff format --check .

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Ruff changes required."
          else
            git commit -m "Apply Ruff lint and formatting cleanup"
            git push origin HEAD:trace-supervised-knapsack-search
          fi
